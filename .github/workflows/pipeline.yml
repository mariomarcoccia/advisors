name: pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - name: Typecheck, tests, and rendered workflow freshness
        run: npm run check
