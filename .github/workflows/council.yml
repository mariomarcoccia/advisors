name: council

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/council
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/council/package-lock.json
      - run: npm ci
      - name: Lint dossiers
        run: node src/cli.ts lint
      - name: Index is committed and fresh
        run: node src/cli.ts index --check
      - name: Typecheck and tests
        run: npm run check
